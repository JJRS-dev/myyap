name: Apply catalog update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-catalog-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply updated storefront
        shell: bash
        run: |
          cat .update/chunk*.txt | base64 -d | gunzip > index.html
          cp index.html purograne.html
          rm -rf .update
          rm -f site-payload.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza catálogo com imagens e cards profissionais"
          git push
