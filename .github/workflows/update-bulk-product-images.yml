name: Atualizar imagens a granel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-bulk-product-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar buscas de imagens a granel
        run: python scripts/update_bulk_product_images.py

      - name: Commit das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html purograne.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git commit -m "feat: adiciona imagens a granel específicas por produto"
          git push
